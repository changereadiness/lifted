name: Publish Lifted Entry 004

on:
  push:
    paths:
      - '.github/workflows/publish-entry-004.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Place Entry 004 inside Evidence section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          entry_b64 = ''
          entry = base64.b64decode(entry_b64).decode('utf-8')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          token = '<span>ENTRY 004</span>'
          if token in text:
              pos = text.index(token)
              start = text.rfind('<article class="field-note reveal">', 0, pos)
              end = text.index('</article>', pos) + len('</article>')
              if start < 0:
                  raise SystemExit('Entry 004 start not found')
              text = text[:start] + text[end:]

          privacy = '    <section class="content-section section-shell privacy-section"'
          privacy_pos = text.index(privacy)
          evidence_close = text.rfind('    </section>', 0, privacy_pos)
          if evidence_close < 0:
              raise SystemExit('Evidence closing tag not found')

          text = text[:evidence_close] + entry + '\n' + text[evidence_close:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "Lifted publication bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Entry 004 already correctly placed."
            exit 0
          fi
          git commit -m "Place Lifted Entry 004 inside Evidence section"
          git push origin HEAD:main
